<style>
/* ---------- скоуп: всё живёт внутри #wme-header ----------
   !important на цветах/шрифтах стоит намеренно: тема Tilda задаёт свои
   правила для a/button, и без этого ссылки перекрашиваются в цвет темы. */
#wme-header, #wme-header *, #wme-header *::before, #wme-header *::after{
  box-sizing: border-box;
  line-height: 1.2;
}
#wme-header{
  --wme-bg:   #000;
  --wme-ink:  #f2ece1;
  --wme-dim:  rgba(242,236,225,.62);
  --wme-line: rgba(242,236,225,.14);

  position: relative;
  z-index: 100;
  width: 100%;
  background: var(--wme-bg) !important;
  color: var(--wme-ink) !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif !important;
  -webkit-font-smoothing: antialiased;
}
#wme-header .wme-inner{
  max-width: 1260px;
  margin: 0 auto;
  padding: 14px 28px;
  display: flex;
  align-items: center;
  gap: 28px;
}

/* ---------- логотип ---------- */
#wme-header .wme-logo{
  flex: 0 0 auto;
  display: block;
  line-height: 0 !important;
  text-decoration: none !important;
  border: 0 !important;
}
#wme-header .wme-svg{
  display: block;
  height: 52px;
  width: auto;
  fill: var(--wme-ink) !important;
  overflow: visible;
  vertical-align: middle;
}
/* общая точка отсчёта — центр миндалины по замеренному bbox */
#wme-header .wme-eye,
#wme-header .wme-lashes{
  transform-box: view-box;
  transform-origin: 75px 43.5px;
}
/* радужка + зрачок, JS правит --tx/--ty (в юнитах viewBox) */
#wme-header .wme-eyeball{
  --tx: 0; --ty: 0;
  transform: translate(calc(var(--tx) * 1px), calc(var(--ty) * 1px));
  will-change: transform;
}
/* моргание: веко и ресницы одним кадром */
#wme-header .wme-svg.is-blinking .wme-eye{ animation: wme-blink .26s cubic-bezier(.4,0,.2,1); }
@keyframes wme-blink{
  0%,100%{ transform: scaleY(1); }
  45%,55%{ transform: scaleY(.05); }
}
#wme-header .wme-svg.is-blinking .wme-lashes{ animation: wme-lash .26s cubic-bezier(.4,0,.2,1); }
@keyframes wme-lash{
  0%,100%{ transform: scale(1); }
  45%,55%{ transform: scale(.72) scaleY(.82); }
}

/* ---------- навигация ---------- */
#wme-header .wme-nav{
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 26px;
}
#wme-header .wme-nav a{
  text-decoration: none !important;
  border: 0 !important;
  white-space: nowrap;
  font-family: inherit !important;
}
#wme-header .wme-link{
  color: var(--wme-ink) !important;
  background: none !important;
  font-size: 15px !important;
  font-weight: 500 !important;
  letter-spacing: .01em;
  padding: 6px 0;
  position: relative;
  transition: color .18s ease;
}
/* подчёркивание растёт от центра */
#wme-header .wme-link::after{
  content: "";
  position: absolute;
  left: 50%; right: 50%; bottom: 0;
  height: 2px;
  background: currentColor;
  transition: left .22s ease, right .22s ease;
}
#wme-header .wme-link:hover::after,
#wme-header .wme-link:focus-visible::after{ left: 0; right: 0; }

#wme-header .wme-phone{
  color: var(--wme-ink) !important;
  background: none !important;
  font-size: 15px !important;
  font-weight: 700 !important;
  letter-spacing: .01em;
  margin-left: 4px;
  transition: opacity .18s ease;
}
#wme-header .wme-phone:hover{ opacity: .7; }

#wme-header .wme-cta{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 20px;
  border-radius: 999px !important;
  background: var(--wme-ink) !important;
  color: var(--wme-bg) !important;
  font-size: 15px !important;
  font-weight: 600 !important;
  transition: transform .18s ease, box-shadow .18s ease;
}
#wme-header .wme-cta:hover{
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(242,236,225,.22);
}
#wme-header .wme-cta:active{ transform: translateY(0); }
#wme-header .wme-tg{
  width: 17px; height: 17px;
  fill: currentColor;
  flex: 0 0 auto;
}

#wme-header a:focus-visible,
#wme-header button:focus-visible{
  outline: 2px solid var(--wme-ink);
  outline-offset: 3px;
  border-radius: 4px;
}

/* ---------- бургер ---------- */
#wme-header .wme-burger{
  display: none;
  order: 3;
  margin-left: auto;
  width: 44px; height: 44px;
  padding: 11px 10px;
  background: none !important;
  border: 0 !important;
  box-shadow: none !important;
  cursor: pointer;
  flex-direction: column;
  justify-content: space-between;
}
#wme-header .wme-burger span{
  display: block;
  height: 2px;
  width: 100%;
  background: var(--wme-ink) !important;
  border-radius: 2px;
  transition: transform .25s ease, opacity .2s ease;
}
#wme-header .wme-burger[aria-expanded="true"] span:nth-child(1){ transform: translateY(9px) rotate(45deg); }
#wme-header .wme-burger[aria-expanded="true"] span:nth-child(2){ opacity: 0; }
#wme-header .wme-burger[aria-expanded="true"] span:nth-child(3){ transform: translateY(-9px) rotate(-45deg); }

/* ---------- мобильная раскладка ---------- */
@media (max-width: 960px){
  #wme-header .wme-inner{ padding: 12px 18px; gap: 14px; flex-wrap: wrap; }
  #wme-header .wme-svg{ height: 40px; }
  #wme-header .wme-burger{ display: flex; }

  #wme-header .wme-nav{
    order: 4;
    flex: 1 0 100%;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    gap: 0;
    overflow: hidden;
    max-height: 0;
    transition: max-height .3s ease;
  }
  #wme-header .wme-nav.is-open{ max-height: 460px; }

  #wme-header .wme-link,
  #wme-header .wme-phone{
    padding: 15px 2px;
    border-top: 1px solid var(--wme-line) !important;
    font-size: 17px !important;
    margin: 0;
  }
  #wme-header .wme-link::after{ display: none; }
  #wme-header .wme-cta{
    margin: 16px 0 8px;
    justify-content: center;
    padding: 14px 20px;
  }
}

@media (prefers-reduced-motion: reduce){
  #wme-header .wme-svg.is-blinking .wme-eye,
  #wme-header .wme-svg.is-blinking .wme-lashes{ animation: none; }
  #wme-header .wme-nav{ transition: none; }
}

/* ---------------------------------------------------------------
   ЕСЛИ ЧЁРНАЯ ПОЛОСА НЕ ДОХОДИТ ДО КРАЁВ ЭКРАНА
   Значит блок Tilda сидит в контейнере с полями. Сначала попробуй в
   настройках блока поставить ширину контейнера 100%. Если не помогло —
   раскомментируй правило ниже, оно вырывает шапку из контейнера.
   Осторожно: на Windows появляется полоса горизонтальной прокрутки
   шириной со скроллбар, поэтому это запасной вариант, а не основной.

#wme-header{
  width: 100vw;
  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
}
   --------------------------------------------------------------- */
</style>

<script>
(function () {
  var root = document.getElementById('wme-header');
  if (!root || root.dataset.wmeReady) return;   // защита от повторной инициализации
  root.dataset.wmeReady = '1';

  /* ---------- глаз следит за курсором ---------- */
  var svg     = root.querySelector('.wme-svg');
  var eyeball = root.querySelector('.wme-eyeball');

  var IRIS  = { x: 74.5, y: 45.5 };  // центр радужки в покое, координаты viewBox
  var MAX_X = 9.5;   // ход по горизонтали (миндалина широкая — запаса больше)
  var MAX_Y = 3.2;   // ход по вертикали
  var REACH = 320;   // px: дистанция курсора, на которой ход максимальный
  var EASE  = 0.18;

  var targetX = 0, targetY = 0, curX = 0, curY = 0;
  var center = { x: 0, y: 0 };
  var pointer = null;

  function measure() {
    var ctm = svg.getScreenCTM();
    if (!ctm) return;
    center.x = ctm.a * IRIS.x + ctm.c * IRIS.y + ctm.e;
    center.y = ctm.b * IRIS.x + ctm.d * IRIS.y + ctm.f;
  }

  function aim() {
    if (!pointer) { targetX = targetY = 0; return; }
    var dx = pointer.x - center.x, dy = pointer.y - center.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 0.5) { targetX = targetY = 0; return; }
    var k = Math.min(1, dist / REACH);
    targetX = (dx / dist) * MAX_X * k;
    targetY = (dy / dist) * MAX_Y * k;
  }

  // на тач-устройствах курсора нет — глаз медленно осматривается сам
  var idle = !window.matchMedia('(pointer: fine)').matches;
  var t0 = null;

  function frame(ts) {
    if (idle) {
      if (t0 === null) t0 = ts;
      var t = (ts - t0) / 1000;
      targetX = Math.sin(t * 0.55) * MAX_X * 0.75;
      targetY = Math.sin(t * 0.37) * MAX_Y * 0.75;
    }
    curX += (targetX - curX) * EASE;
    curY += (targetY - curY) * EASE;
    eyeball.style.setProperty('--tx', curX.toFixed(3));
    eyeball.style.setProperty('--ty', curY.toFixed(3));
    requestAnimationFrame(frame);
  }

  window.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch') return;
    idle = false;
    pointer = { x: e.clientX, y: e.clientY };
    measure();
    aim();
  }, { passive: true });

  document.addEventListener('pointerleave', function () { pointer = null; aim(); });
  window.addEventListener('blur',   function () { pointer = null; aim(); });
  window.addEventListener('resize', function () { measure(); aim(); });
  window.addEventListener('scroll', function () { measure(); aim(); }, { passive: true });

  measure();
  requestAnimationFrame(frame);

  /* ---------- моргание ---------- */
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var blink = function () {
      svg.classList.add('is-blinking');
      setTimeout(function () { svg.classList.remove('is-blinking'); }, 300);
      setTimeout(blink, 2600 + Math.random() * 4200);
    };
    setTimeout(blink, 1800);
  }

  /* ---------- мобильное меню ---------- */
  var burger = root.querySelector('.wme-burger');
  var nav    = root.querySelector('.wme-nav');

  burger.addEventListener('click', function () {
    var open = burger.getAttribute('aria-expanded') === 'true';
    burger.setAttribute('aria-expanded', String(!open));
    nav.classList.toggle('is-open', !open);
  });

  // клик по пункту закрывает меню
  nav.addEventListener('click', function (e) {
    if (!e.target.closest('a')) return;
    burger.setAttribute('aria-expanded', 'false');
    nav.classList.remove('is-open');
  });

  // возврат на десктоп — сбрасываем состояние, чтобы max-height не залип
  window.addEventListener('resize', function () {
    if (window.innerWidth > 960) {
      burger.setAttribute('aria-expanded', 'false');
      nav.classList.remove('is-open');
    }
  });
})();
</script>
